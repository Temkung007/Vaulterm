name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.5.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "Termkin $VER" \
              --generate-notes \
              --target "${{ github.sha }}"
          else
            gh release edit "$TAG" --draft=true
          fi
          ID=$(gh release view "$TAG" --json databaseId -q .databaseId)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run frontend, CLI, and Rust tests
        shell: bash
        run: |
          pnpm run typecheck
          pnpm run test:cli
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload Tauri artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Build combined latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          export WIN_ASSET="Termkin_${VER}_x64-setup.exe"
          export MAC_ASSET="Termkin_universal.app.tar.gz"
          gh release download "$TAG" -p "${WIN_ASSET}.sig" -p "${MAC_ASSET}.sig"
          node -e '
            const fs = require("fs");
            const repo = process.env.GH_REPO;
            const tag = process.env.TAG;
            const ver = process.env.VER;
            const winSig = fs.readFileSync(process.env.WIN_ASSET + ".sig", "utf8").trim();
            const macSig = fs.readFileSync(process.env.MAC_ASSET + ".sig", "utf8").trim();
            if (!winSig || !macSig) throw new Error("Empty signature file");
            const winUrl = `https://github.com/${repo}/releases/download/${tag}/${process.env.WIN_ASSET}`;
            const macUrl = `https://github.com/${repo}/releases/download/${tag}/${process.env.MAC_ASSET}`;
            const winEntry = { signature: winSig, url: winUrl };
            const macEntry = { signature: macSig, url: macUrl };
            const manifest = {
              version: ver,
              notes: `Termkin ${ver}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": winEntry,
                "windows-x86_64-nsis": winEntry,
                "darwin-aarch64": macEntry,
                "darwin-x86_64": macEntry,
                "darwin-universal": macEntry,
                "darwin-aarch64-app": macEntry,
                "darwin-x86_64-app": macEntry,
                "darwin-universal-app": macEntry,
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          '
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false
